openapi: 3.1.0
info:
  contact:
    name: SimpleCloud support
    url: https://discord.simplecloud.app
  description: "Manage Minecraft networks, server groups, persistent servers, players,\
    \ and plugins. Authenticate with Authorization: Bearer <JWT> or X-Network-Credential:\
    \ <network password or JWT>. Bearer authentication takes precedence when both\
    \ headers are supplied. Network-scoped operations also require X-Network-ID. JWT\
    \ permissions and network membership restrict access; network passwords grant\
    \ full access to their network, except that they cannot read the audit log. Registration\
    \ requires an existing credential; password authentication also requires its existing\
    \ network ID. The admin endpoint requires an admin JWT. Credential verification\
    \ accepts credentials in the request body without authentication headers."
  title: SimpleCloud Controller API
  version: "1.0"
externalDocs:
  description: ""
  url: ""
servers:
- url: https://controller.simplecloud.app/
paths:
  /v0/admin/networks:
    get:
      description: List all networks. Requires admin access.
      operationId: list_all_networks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ListNetworksResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkJWT: []
      summary: List all networks (admin only)
      tags:
      - admin
  /v0/audit-events:
    get:
      description: "Lists the network's audit events, newest first. Requires the audit_log:read\
        \ permission, which covers every event in the network regardless of the caller's\
        \ other permissions. API keys (network passwords) cannot read the audit log.\
        \ To get the next page, pass next_cursor as cursor with the same filters."
      operationId: list_audit_events
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: "Earliest occurrence, inclusive (RFC 3339)"
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Latest occurrence, exclusive (RFC 3339)"
        explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: "Action, for example server_groups.update"
        explode: true
        in: query
        name: action
        required: false
        schema:
          type: string
        style: form
      - description: "Resource type, for example server_groups"
        explode: true
        in: query
        name: resource_type
        required: false
        schema:
          type: string
        style: form
      - description: Resource ID
        explode: true
        in: query
        name: resource_id
        required: false
        schema:
          type: string
        style: form
      - description: User ID or API key ID
        explode: true
        in: query
        name: actor_id
        required: false
        schema:
          type: string
        style: form
      - description: Page size
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
        style: form
      - description: next_cursor from the previous page
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ListAuditEventsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: List audit events
      tags:
      - audit
  /v0/blueprints:
    delete:
      description: Delete an existing blueprint
      operationId: delete_blueprint
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: Blueprint ID
        explode: true
        in: query
        name: blueprint_id
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.DeleteBlueprintResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Delete a blueprint
      tags:
      - blueprints
    get:
      description: Get a list of blueprints for a network
      operationId: list_blueprints
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ListBlueprintsResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: List blueprints
      tags:
      - blueprints
    patch:
      description: Partially update an existing blueprint
      operationId: patch_blueprint
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: Blueprint ID
        explode: true
        in: query
        name: blueprint_id
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/models.PatchBlueprintRequest"
              description: Blueprint fields to update
              summary: request
        description: Blueprint fields to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.UpdateBlueprintResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Partially update a blueprint
      tags:
      - blueprints
    post:
      description: Create a new blueprint for a network
      operationId: create_blueprint
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/models.CreateBlueprintRequest"
              description: Blueprint details
              summary: request
        description: Blueprint details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.CreateBlueprintResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Create a new blueprint
      tags:
      - blueprints
    put:
      description: Update an existing blueprint
      operationId: update_blueprint
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: Blueprint ID
        explode: true
        in: query
        name: blueprint_id
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/models.UpdateBlueprintRequest"
              description: Blueprint details
              summary: request
        description: Blueprint details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.UpdateBlueprintResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Update a blueprint
      tags:
      - blueprints
  /v0/environment-variables:
    delete:
      description: Deletes a network environment variable by its key.
      operationId: delete_environment_variable
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: Environment variable key
        explode: true
        in: query
        name: key
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.DeleteEnvironmentVariableResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Delete an environment variable
      tags:
      - environment-variables
    get:
      description: Lists network environment variables with readable values. Values
        are decrypted by the controller after loading encrypted database rows.
      operationId: list_environment_variables
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ListEnvironmentVariablesResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: List environment variables
      tags:
      - environment-variables
    post:
      description: Creates a readable network environment variable. Its value is encrypted
        by the controller before it is stored.
      operationId: create_environment_variable
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/models.WriteEnvironmentVariableRequest"
              description: Environment variable key and plaintext value
              summary: request
        description: Environment variable key and plaintext value
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.CreateEnvironmentVariableResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Create an environment variable
      tags:
      - environment-variables
    put:
      description: Replaces a readable network environment variable. Its value is
        encrypted by the controller before it is stored.
      operationId: update_environment_variable
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/models.WriteEnvironmentVariableRequest"
              description: Environment variable key and plaintext value
              summary: request
        description: Environment variable key and plaintext value
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.UpdateEnvironmentVariableResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Update an environment variable
      tags:
      - environment-variables
  /v0/ip:
    get:
      description: Returns the caller's IP address. Production ingress must restrict
        traffic to Cloudflare because CF-Connecting-IP is trusted. Direct requests
        without that header use the socket address. No authentication is required.
      operationId: get_client_ip
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ClientIPResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
      summary: Get your IP address
      tags:
      - network
  /v0/metrics/logs/query:
    post:
      description: Query logs using POST body with array-based filters for maximum
        flexibility
      operationId: query_logs
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: "#/components/schemas/models.LogQueryRequest"
              description: Query filters
              summary: body
        description: Query filters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.LogsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Query logs with flexible filters
      tags:
      - metrics
  /v0/metrics/logs/stream:
    get:
      description: Server-Sent Events endpoint for real-time log streaming with filters
      operationId: stream_logs
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-separated server IDs
        explode: true
        in: query
        name: server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server group IDs
        explode: true
        in: query
        name: server_group_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated persistent server IDs
        explode: true
        in: query
        name: persistent_server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated serverhost IDs
        explode: true
        in: query
        name: serverhost_ids
        required: false
        schema:
          type: string
        style: form
      - description: "Comma-separated severities (ERROR, WARN, INFO, DEBUG)"
        explode: true
        in: query
        name: severities
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated tags
        explode: true
        in: query
        name: tags
        required: false
        schema:
          type: string
        style: form
      - description: Full-text search in messages
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE stream
        "400":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Stream logs in real-time via SSE
      tags:
      - metrics
  /v0/metrics/query:
    get:
      description: "Get the latest values for a metric, optionally grouped by a label"
      operationId: query_metrics
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: "Metric name (e.g., server.player_count, server.cpu_usage_percent)"
        explode: true
        in: query
        name: metric
        required: true
        schema:
          type: string
        style: form
      - description: "Label to group by (e.g., server_group_name, persistent_server_name)"
        explode: true
        in: query
        name: group_by
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server IDs to filter
        explode: true
        in: query
        name: server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server group IDs to filter
        explode: true
        in: query
        name: server_group_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated persistent server IDs to filter
        explode: true
        in: query
        name: persistent_server_ids
        required: false
        schema:
          type: string
        style: form
      - description: "Comma-separated server group types to filter (e.g., SERVER,\
          \ PROXY)"
        explode: true
        in: query
        name: server_type
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/metrics.InstantResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Service Unavailable
      security:
      - BearerAuth: []
      - NetworkCredential: []
      summary: Query current metric values
      tags:
      - metrics
  /v0/metrics/query_range:
    get:
      description: "Get time-bucketed metric values for charts, optionally grouped\
        \ by a label"
      operationId: query_metrics_range
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: "Comma-separated metric names (e.g., server.cpu_usage_percent,server.memory_usage_mb)"
        explode: true
        in: query
        name: metrics
        required: true
        schema:
          type: string
        style: form
      - description: "Start timestamp in RFC3339 format (e.g., 2025-12-24T00:00:00Z)"
        explode: true
        in: query
        name: from
        required: true
        schema:
          type: string
        style: form
      - description: "End timestamp in RFC3339 format (e.g., 2025-12-24T12:00:00Z)"
        explode: true
        in: query
        name: to
        required: true
        schema:
          type: string
        style: form
      - description: "Aggregation interval (e.g., 5m, 1h). Auto-calculated if omitted"
        explode: true
        in: query
        name: step
        required: false
        schema:
          type: string
        style: form
      - description: "Label to group by (e.g., server_group_name, persistent_server_name)"
        explode: true
        in: query
        name: group_by
        required: false
        schema:
          type: string
        style: form
      - description: "Aggregation function: avg (default), sum, max, min"
        explode: true
        in: query
        name: aggregation
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server IDs to filter
        explode: true
        in: query
        name: server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server group IDs to filter
        explode: true
        in: query
        name: server_group_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated persistent server IDs to filter
        explode: true
        in: query
        name: persistent_server_ids
