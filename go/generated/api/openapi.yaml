        \ to start registers its key again. Refused with 409 while the network stores\
        \ secrets, because they are encrypted with this key; delete them first. Serverhosts\
        \ keep their copy of the private key and re-register it on their next start,\
        \ so this does not rotate the key unless the private key is also removed from\
        \ every serverhost."
