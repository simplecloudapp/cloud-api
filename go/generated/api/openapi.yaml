  securitySchemes:
    BearerAuth:
      description: "JWT sent in Authorization: Bearer <token>. Access depends on the\
        \ token's network membership and permissions. The admin endpoint requires\
        \ admin claims."
      scheme: bearer
      type: http
    NetworkCredential:
      description: "Network password or signed JWT. Password authentication also requires\
        \ X-Network-ID and grants full access to that network, except the audit log.\
        \ JWT permissions still apply."
      in: header
      name: X-Network-Credential
      type: apiKey
    NetworkJWT:
      description: Signed JWT with admin claims. Network passwords cannot authorize
        admin operations.
      in: header
      name: X-Network-Credential
      type: apiKey
