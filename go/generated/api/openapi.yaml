    post:
      description: "Requires an inactive source with no server records, queued starts\
        \ or rolling restart. Copies shared settings and transfers plugin and collection\
        \ assignments, then deletes the source atomically. Returns a new inactive\
        \ resource with a new ID. Group scaling and deployment settings are discarded.\
        \ World files and running instances are not migrated. Requires source read/delete\
        \ and destination write permissions."
