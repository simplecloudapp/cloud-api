        explode: false
        in: header
        name: X-Network-Credential
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-separated server IDs
        explode: true
        in: query
        name: server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server group IDs
        explode: true
        in: query
        name: server_group_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated persistent server IDs
