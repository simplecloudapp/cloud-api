        explode: false
        in: header
        name: X-Network-Credential
        required: true
        schema:
          type: string
        style: simple
      - description: "Metric name (e.g., server.player_count, server.cpu_usage_percent)"
        explode: true
        in: query
        name: metric
        required: true
        schema:
          type: string
        style: form
      - description: "Label to group by (e.g., server_group_name, persistent_server_name)"
        explode: true
        in: query
        name: group_by
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server IDs to filter
        explode: true
        in: query
        name: server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server group IDs to filter
        explode: true
        in: query
        name: server_group_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated persistent server IDs to filter
        explode: true
        in: query
        name: persistent_server_ids
        required: false
        schema:
          type: string
        style: form
      - description: "Comma-separated server group types to filter (e.g., SERVER,\
          \ PROXY)"
        explode: true
        in: query
        name: server_type
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/metrics.InstantResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Service Unavailable
      summary: Query current metric values
      tags:
      - metrics
  /v0/metrics/query_range:
    get:
      description: "Get time-bucketed metric values for charts, optionally grouped\
