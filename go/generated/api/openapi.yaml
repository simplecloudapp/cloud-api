    models.ConnectPlayerRequest:
      description: "Request to connect a player. Set exactly one of server_id, server_name,\
        \ server_group_id, server_group_name and persistent_server_id."
      properties:
        persistent_server_id:
          description: Persistent server UUID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        selection_mode:
          description: "How to pick a server of a group: RANDOM (default); MIN_PLAYERS\
            \ or MAX_PLAYERS by reported player count; FIRST, the lowest numerical\
            \ ID. Validated for every target, but only group targets use it: an unknown\
            \ value is a 400."
          example: RANDOM
          type: string
        server_group_id:
          description: Server group UUID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        server_group_name:
          description: "Server group name, matched case-insensitively"
          example: lobby
          type: string
        server_id:
          description: Server UUID
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        server_name:
          description: "Cloud server name, matched case-insensitively: a persistent\
            \ server's name, or \"<group>-<numerical_id>\". This is the name the cloud\
            \ gives the server, not the name a proxy registered it under. A name of\
            \ both a persistent server and a group server is a 409."
          example: lobby-1
          type: string
    models.ConnectPlayerResponse:
      description: Response for connecting a player
      example:
        message: Player connected successfully
        player_id: 069a79f4-44e9-4726-a5be-fca90e38aaf5
        result: SUCCESS
        server_name: lobby-1
        success: true
      properties:
        message:
          example: Player connected successfully
          type: string
        player_id:
          example: 069a79f4-44e9-4726-a5be-fca90e38aaf5
          type: string
        result:
          allOf:
          - $ref: "#/components/schemas/models.ConnectResult"
          description: "How the connect ended. Older clients read message instead:\
            \ NO_SERVER_AVAILABLE and SERVER_NOT_FOUND both have the message \"Target\
            \ server not found\"."
          example: SUCCESS
        server_name:
          description: Cloud name of the server the connect was last tried on; absent
            when no server was available
          example: lobby-1
          type: string
        success:
          example: true
          type: boolean
    models.ConnectResult:
      description: "How a connect ended. SUCCESS: the proxy sent the player to the\
        \ server. ALREADY_CONNECTED: the player already is on it. NO_SERVER_AVAILABLE:\
        \ the target exists, but has no game server in state AVAILABLE, so nothing\
        \ was sent; an unknown target is a 404 instead. SERVER_NOT_FOUND: the proxy\
        \ does not know the server, typically because it has not registered it yet.\
        \ FAILED: the proxy could not send the player."
      enum:
      - SUCCESS
      - ALREADY_CONNECTED
      - NO_SERVER_AVAILABLE
      - SERVER_NOT_FOUND
      - FAILED
      type: string
      x-enum-varnames:
      - ConnectResultSuccess
      - ConnectResultAlreadyConnected
      - ConnectResultNoServerAvailable
      - ConnectResultServerNotFound
      - ConnectResultFailed
