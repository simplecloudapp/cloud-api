        explode: false
        in: header
        name: X-Network-Credential
        required: true
        schema:
          type: string
        style: simple
      - description: "Comma-separated metric names (e.g., server.cpu_usage_percent,server.memory_usage_mb)"
        explode: true
        in: query
        name: metrics
        required: true
        schema:
          type: string
        style: form
      - description: "Start timestamp in RFC3339 format (e.g., 2025-12-24T00:00:00Z)"
        explode: true
        in: query
        name: from
        required: true
        schema:
          type: string
        style: form
      - description: "End timestamp in RFC3339 format (e.g., 2025-12-24T12:00:00Z)"
        explode: true
        in: query
        name: to
        required: true
        schema:
          type: string
        style: form
      - description: "Aggregation interval (e.g., 5m, 1h). Auto-calculated if omitted"
        explode: true
        in: query
        name: step
        required: false
        schema:
          type: string
        style: form
      - description: "Label to group by (e.g., server_group_name, persistent_server_name)"
        explode: true
        in: query
        name: group_by
        required: false
        schema:
          type: string
        style: form
      - description: "Aggregation function: avg (default), sum, max, min"
        explode: true
        in: query
        name: aggregation
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server IDs to filter
        explode: true
        in: query
        name: server_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated server group IDs to filter
        explode: true
        in: query
        name: server_group_ids
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated persistent server IDs to filter
        explode: true
        in: query
        name: persistent_server_ids
        required: false
        schema:
          type: string
        style: form
      - description: "Comma-separated server group types to filter (e.g., SERVER,\
          \ PROXY)"
        explode: true
        in: query
        name: server_type
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/metrics.TimeSeriesResult"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Service Unavailable
      summary: Query metric time series
      tags:
      - metrics
