  /v0/metrics/query:
    get:
      description: "Get the latest values for a metric, optionally grouped by a label"
      x-accepts:
      - application/json
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
