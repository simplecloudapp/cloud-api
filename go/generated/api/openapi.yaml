    models.AuditEvent:
      description: One recorded action in a network's audit log
      example:
        action: server_groups.update
        actor:
          id: user_2abc
          name: alice@example.com
          type: user
        changes: {}
        id: 0192a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
        occurred_at: 2026-10-09T12:30:00.123456Z
        request_id: req_01J9Z3
        resource:
          id: 123e4567-e89b-12d3-a456-426614174000
          name: lobby
          type: server_groups
      properties:
        action:
          example: server_groups.update
          type: string
        actor:
          $ref: "#/components/schemas/models.AuditEventActor"
        changes:
          description: |-
            Changes maps each changed field to {"from": old, "to": new}, or to
            {"changed": true} for redacted fields. Over the size cap it is
            {"_truncated": true, "fields": [names]}, without fields when the names
            alone are too long. It is null when the action records no changes.
          type: object
        id:
          example: 0192a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
          type: string
        occurred_at:
          example: 2026-10-09T12:30:00.123456Z
          type: string
        request_id:
          description: RequestID correlates the event with request logs. Clients may
            set it.
          example: req_01J9Z3
          type: string
        resource:
          $ref: "#/components/schemas/models.AuditEventResource"
    models.AuditEventActor:
      description: Who performed an audited action
      example:
        id: user_2abc
        name: alice@example.com
        type: user
      properties:
        id:
          description: ID is the user's ID or the API key's (network password's) ID.
          example: user_2abc
          type: string
        name:
          description: |-
            Name is a snapshot taken when the event was recorded: the user's email
            or the API key's name. It is null when unknown, such as for unnamed keys.
          example: alice@example.com
          type: string
        type:
          enum:
          - user
          - api_key
          example: user
          type: string
    models.AuditEventResource:
      description: What an audited action affected
      example:
        id: 123e4567-e89b-12d3-a456-426614174000
        name: lobby
        type: server_groups
      properties:
        id:
          example: 123e4567-e89b-12d3-a456-426614174000
          type: string
        name:
          description: "Name is a snapshot taken when the event was recorded, or null."
          example: lobby
          type: string
        type:
          example: server_groups
          type: string
