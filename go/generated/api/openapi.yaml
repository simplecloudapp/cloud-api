  /v0/players:
    get:
      description: Get a list of players for a network with optional filtering
      operationId: list_players
      parameters:
      - description: Network ID
        explode: false
        in: header
        name: X-Network-ID
        required: true
        schema:
          type: string
        style: simple
      - description: Filter by online status
        explode: true
        in: query
        name: online
        required: false
        schema:
          type: boolean
        style: form
      - description: Filter by exact connected server name; implies online=true
        explode: true
        in: query
        name: server
        required: false
        schema:
          type: string
        style: form
      - description: Filter by exact connected proxy name; implies online=true
        explode: true
        in: query
        name: proxy
        required: false
        schema:
          type: string
        style: form
      - description: Filter by player UUID; repeat the parameter or use comma-separated
          values
        explode: true
        in: query
        name: player_id
        required: false
        schema:
          items:
            type: string
          type: array
          default: null
        style: form
      - description: Include players first seen at or after this RFC3339 timestamp
        explode: true
        in: query
        name: first_seen_from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Include players first seen at or before this RFC3339 timestamp
        explode: true
        in: query
        name: first_seen_to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Include players last seen at or after this RFC3339 timestamp
        explode: true
        in: query
        name: last_seen_from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Include players last seen at or before this RFC3339 timestamp
        explode: true
        in: query
        name: last_seen_to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Minimum accumulated online time in seconds
        explode: true
        in: query
        name: online_time_seconds_min
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Maximum accumulated online time in seconds
        explode: true
        in: query
        name: online_time_seconds_max
        required: false
        schema:
          minimum: 0
          type: integer
        style: form
      - description: Case-insensitive literal substring search against the current
          name
        explode: true
        in: query
        name: search
        required: false
        schema:
          type: string
        style: form
      - description: Sort field
        explode: true
        in: query
        name: sort_by
        required: false
        schema:
          default: last_seen
          enum:
          - name
          - last_seen
          - last_login
          - online_time_seconds
          - online_time
          - first_seen
          - first_login
          type: string
        style: form
      - description: Sort order
        explode: true
        in: query
        name: sort_order
        required: false
        schema:
          default: desc
          enum:
          - asc
          - desc
          type: string
        style: form
      - description: "Limit results (default 50, maximum 1000)"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: Offset for pagination
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ListPlayersResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/models.ErrorResponse"
          description: Internal Server Error
      security:
      - BearerAuth: []
      - NetworkCredential: []
