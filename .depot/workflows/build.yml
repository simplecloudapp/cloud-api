name: build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.action == 'labeled' && 'label' || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && github.event.pull_request.draft == false
    runs-on: depot-ubuntu-24.04-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Test
        run: |
          ./gradlew :api:check -Pnats \
            :platform:shared:check \
            :platform:spigot:check \
            :platform:spigot-legacy:check \
            :platform:paper:check \
            :platform:bungeecord:check \
            :platform:velocity:check \
            :platform:minestom:check \
            --configure-on-demand \
            --parallel \
            --build-cache

  publish:
    needs: build
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'publish') &&
          (github.event.action != 'labeled' || github.event.label.name == 'publish')
        )
      )
    runs-on: depot-ubuntu-24.04-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Get Version
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          VERSION="$(echo "$BRANCH" | sed -E 's#[^A-Za-z0-9._-]+#-#g')-SNAPSHOT"
          echo "PUBLISH_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version $VERSION"

      - name: Publish Artifacts
        env:
          SIMPLECLOUD_REPOSITORY: dev
          SIMPLECLOUD_USERNAME: ${{ secrets.SIMPLECLOUD_USERNAME }}
          SIMPLECLOUD_PASSWORD: ${{ secrets.SIMPLECLOUD_PASSWORD }}
        run: |
          if [ -z "${SIMPLECLOUD_USERNAME:-}" ] || [ -z "${SIMPLECLOUD_PASSWORD:-}" ]; then
            echo "::error::SimpleCloud repository credentials are not configured"
            exit 1
          fi

          ./gradlew :api:prepareGeneratedSources             publishAllPublicationsToSimplecloudRepository             --parallel             --build-cache
