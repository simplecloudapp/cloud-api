name: Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: depot-ubuntu-24.04-4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Test
        run: |
          ./gradlew :spotlessCheck \
            :api:check \
            :platform:shared:check \
            :platform:spigot:check \
            :platform:spigot-legacy:check \
            :platform:paper:check \
            :platform:bungeecord:check \
            :platform:velocity:check \
            :platform:minestom:check \
            --configure-on-demand \
            --parallel \
            --build-cache
